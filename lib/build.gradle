plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

group = 'com.github.jintin'

android {
    buildFeatures {
        viewBinding true
    }
    defaultConfig {
        compileSdk 34
        buildToolsVersion = "34.0.0"
        minSdkVersion 16
        targetSdkVersion 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.jintin.bindingextension'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}

ext {
    GROUP_ID = "io.github.jintin" // your project id registered in Sonatype
    ARTIFACT_ID = "BindingExtension" // name of your library
    VERSION = "1.0.0"
    SITE_URL = 'https://github.com/Jintin/BindingExtension'
    GIT_URL = 'https://github.com/Jintin/BindingExtension.git'
}

apply from: 'publish.gradle'